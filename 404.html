<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questa pagina non esiste — Cyber Boomer</title>
<meta name="description" content="La pagina che cercavi non c'è. Succede. Il dojo però è sempre aperto.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://cyberboomer.ninja/404.html">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="Questa pagina non esiste — Cyber Boomer">
<meta property="og:description" content="La pagina che cercavi non c'è. Il dojo però è sempre aperto.">
<meta property="og:url" content="https://cyberboomer.ninja/404.html">
<meta property="og:image" content="https://cyberboomer.ninja/og-image.png">
<meta property="og:site_name" content="Cyber Boomer">

<link rel="stylesheet" href="/stile.css">
<style>
  /* Il tronco sta in /stile.css, uno per tutta la casa. Qui solo la messa in
     pagina del 404: tutto al centro dello schermo. — JUDY, 08/09 */
  body{
    display:flex; align-items:center; justify-content:center;
    padding:3rem 1.5rem; text-align:center;
  }
  .box{ max-width:560px; }
  .code{
    font-family:var(--font-mono); font-size:clamp(3.5rem,14vw,6rem); font-weight:700;
    letter-spacing:.06em; color:var(--voice); line-height:1;
  }
  .cursor{
    display:inline-block; width:.5em; height:.82em; margin-left:.06em;
    background:var(--voice); vertical-align:baseline; animation:blink 1.1s steps(1) infinite;
  }
  h1{ margin-top:1.5rem; font-size:clamp(1.3rem,4.5vw,1.8rem); font-weight:600; }
  p{ margin-top:1rem; color:var(--text-lo); }
  .torna{ display:flex; flex-wrap:wrap; gap:.7rem; justify-content:center; margin-top:2.5rem; }
  .torna a{
    font-family:var(--font-mono); font-size:.7rem; letter-spacing:.2em; text-transform:uppercase;
    color:var(--voice); text-decoration:none; border:1px solid var(--line);
    background:var(--bg-surface); padding:.75em 1.1em; transition:border-color .25s, background .25s;
  }
  .torna a:hover, .torna a:focus-visible{ border-color:var(--voice); background:var(--voice-soft); }
  @keyframes blink{ 0%,55%{opacity:1;} 56%,100%{opacity:0;} }
  @media (prefers-reduced-motion: reduce){
    .cursor{ animation:none; }
    .torna a{ transition:none; }
  }
</style>
</head>
<body>
  <div class="box">
    <p class="code">404<span class="cursor" aria-hidden="true"></span></p>
    <h1>Questa pagina non esiste.</h1>
    <p>Capita anche alle cose serie. Però visto che sei qui:
    <strong>un link che promette una pagina che non c'è</strong> è il primo trucco
    che si impara a riconoscere nel dojo. Questo però è colpa nostra, non di un truffatore.</p>
    <div class="torna">
      <a href="/">← La voce</a>
      <a href="/lezioni/">Il dojo</a>
    </div>
  </div>
</body>
</html>
